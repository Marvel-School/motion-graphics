<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 12px sans-serif; color: var(--uxp-host-text-color); padding: 8px; }
  h2 { font-size: 13px; margin: 14px 0 6px; }
  sp-textfield { width: 100%; }
  #log { white-space: pre-wrap; font-family: monospace; font-size: 11px; margin-top: 12px; }
  .row { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
</style>
</head>
<body>
  <!-- Spike for task 5 of docs/plans/2026-10-22-daily-use.md: can a panel do the three Premiere moves? -->
  <h2>1. Selected clip</h2>
  <sp-button id="inspect">Show selected clip and sequence</sp-button>

  <h2>2. Import a file</h2>
  <sp-textfield id="file" placeholder="Full path to a .mov"></sp-textfield>
  <div class="row"><sp-button id="import">Import into project</sp-button></div>

  <h2>3. Place at playhead</h2>
  <div class="row">
    <sp-textfield id="track" value="1" style="width:60px"></sp-textfield>
    <span>video track index (0 = V1, 1 = V2)</span>
  </div>
  <div class="row"><sp-button id="place">Import and place at playhead</sp-button></div>

  <div id="log"></div>
  <script src="main.js"></script>
</body>
</html>
