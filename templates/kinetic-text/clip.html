<!doctype html>
<html><head><meta charset="utf-8">
<style>
/* brand */
:root{--brand:"";--bg:#111;--fg:#fff;--primary:#555;--accent:#aaa;--font-display:sans-serif;--font-body:sans-serif;--logo-src:""}
/* /brand */
html,body{margin:0;overflow:hidden;background:transparent}
/* Kinetic text: one word at a time, centered, cut on an even beat. Each word slams in from 1.5x;
   the next word replaces it on the cut. An accent bar slides in under the last word. */
.stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.word{width:max-content;white-space:nowrap;color:var(--fg);font:400 40vmin/1 var(--font-display);letter-spacing:-0.01em}
/* The box holds the fitted size; the slam grows the inner text past it, centered, so nothing else moves. */
.word.fitted{display:flex;align-items:center;justify-content:center}
.word span{display:block;width:max-content}
.barMask{overflow:hidden;margin-top:2.4vmin}
.bar{height:2.2vmin;background:var(--accent)}
@media (orientation: portrait){ .word{font-size:40vmin} .barMask{margin-top:3vmin} .bar{height:2.6vmin} }
</style></head>
<body>
<div class="stage">
  <div class="word" id="word"><span id="txt"></span></div>
  <div class="barMask" id="barMask"><div class="bar" id="bar"></div></div>
</div>
<script>
const DATA = MG.clip(
  { width: 1920, height: 1080, fps: 25, duration: 3.6, alpha: true },
  { words: 'Make it. Ship it. Own it.' }
);
const $ = id => document.getElementById(id);
const { prog, ease, spring } = MG;
const D = CLIP.duration;
const words = String(DATA.words).split(/\s+/).filter(Boolean);
const N = words.length;
const BEAT = (D - 1.0) / N;           // words spread over the first D - 1.0 s; the last one holds to the end
const LAST = (N - 1) * BEAT;
const word = $('word'), txt = $('txt');
// Every word in the element at load, so the display font (and every glyph range it needs) loads
// before the renderer's fonts.ready. An empty element at load leaves the font unrequested.
txt.textContent = words.join(' ');

window.seek = t => {
  // Hard cut: exactly one word on screen, picked from t.
  const i = Math.min(N - 1, Math.max(0, Math.floor(t / BEAT + 1e-6)));
  const t0 = i * BEAT;
  txt.textContent = words[i];

  // Fit: at most 80% of frame width and 70% of frame height. Measured here, after fonts load.
  // Base size read here, not at script start: the renderer sizes the viewport after the script runs.
  word.classList.remove('fitted');
  word.style.width = word.style.height = txt.style.fontSize = '';
  const baseSize = parseFloat(getComputedStyle(word).fontSize);
  const w = word.offsetWidth, h = word.offsetHeight;
  const size = baseSize * Math.min(1, (innerWidth * 0.8) / w, (innerHeight * 0.7) / h);
  txt.style.fontSize = size + 'px';
  const fitW = txt.offsetWidth, fitH = txt.offsetHeight;
  word.classList.add('fitted');
  word.style.width = fitW + 'px';
  word.style.height = fitH + 'px';

  // Slam: 1.5x to 1x on a stiff spring with a small overshoot. Driven through font-size, not
  // transform: scale(), because Chromium rasterized scaled text this large differently between runs.
  // Wide words start smaller so even the first frame stays inside title-safe (90% of frame width).
  const from = Math.min(1.5, (innerWidth * 0.9) / fitW, (innerHeight * 0.9) / fitH);
  const s = spring(t, t0, from, 1, { stiffness: 22, damping: 0.62 });
  txt.style.fontSize = size * s + 'px';

  // Accent bar under the last word: slides in from the left once the word has landed.
  const onLast = i === N - 1;
  $('barMask').style.width = fitW + 'px';
  const bIn = onLast ? ease.outExpo(prog(t, LAST + 0.15, 0.45)) : 0;
  $('bar').style.transform = `translateX(${(bIn - 1) * 101}%)`;
};
</script>
</body></html>
