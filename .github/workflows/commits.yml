name: Commits

# The pull request title and description become the commit on the protected
# branch, so this check also runs when only they change (edited). Installed by the
# engineering plugin's protect-repo skill; the script is .github/scripts/commits.mjs.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Title and description go in through env, never pasted into the script: outside input.
      - run: node .github/scripts/commits.mjs "origin/${{ github.base_ref }}"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
